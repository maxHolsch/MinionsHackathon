<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sharing Station — Dev Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --muted: #8b949e;
      --accent: #f78166;
      --green: #3fb950;
      --amber: #d29922;
      --blue: #58a6ff;
      --red: #f85149;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    /* ── HEADER ── */
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    header h1 { font-size: 1rem; font-weight: 600; color: var(--accent); flex: 1; }
    #conv-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--muted); flex-shrink: 0;
      transition: background 0.3s;
    }
    #conv-dot.active { background: var(--green); box-shadow: 0 0 6px var(--green); }
    #conv-label { font-size: 0.75rem; color: var(--muted); }
    #btn-stop {
      padding: 4px 12px; border-radius: 6px; border: 1px solid var(--red);
      background: transparent; color: var(--red); font-size: 0.75rem;
      cursor: pointer;
    }
    #btn-stop:hover { background: var(--red); color: white; }
    #btn-mic {
      padding: 4px 12px; border-radius: 6px; border: 1px solid var(--blue);
      background: transparent; color: var(--blue); font-size: 0.75rem;
      cursor: pointer;
    }
    #btn-mic:hover { background: var(--blue); color: #0d1117; }
    #btn-mic.muted { border-color: var(--red); color: var(--red); }
    #btn-mic.muted:hover { background: var(--red); color: white; }

    /* ── MAIN GRID ── */
    main {
      display: grid;
      grid-template-columns: 260px 1fr 300px;
      gap: 0;
      overflow: hidden;
      height: calc(100vh - 49px);
    }

    /* ── PANELS ── */
    .panel {
      display: flex; flex-direction: column;
      border-right: 1px solid var(--border);
      overflow: hidden;
    }
    .panel:last-child { border-right: none; }

    .panel-title {
      padding: 8px 14px;
      font-size: 0.7rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .panel-body {
      flex: 1; overflow-y: auto; padding: 12px;
      display: flex; flex-direction: column; gap: 12px;
    }

    /* ── CONTROLS ── */
    .section-label {
      font-size: 0.65rem; text-transform: uppercase;
      letter-spacing: 0.1em; color: var(--muted); margin-bottom: 6px;
    }

    .nfc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }

    .btn {
      padding: 7px 10px; border-radius: 6px; border: 1px solid var(--border);
      background: var(--surface); color: var(--text);
      font-size: 0.78rem; cursor: pointer; text-align: center;
      transition: border-color 0.15s, background 0.15s;
    }
    .btn:hover { border-color: var(--blue); background: #1c2334; }
    .btn.primary { background: var(--blue); border-color: var(--blue); color: #0d1117; font-weight: 600; }
    .btn.primary:hover { background: #79b8ff; }
    .btn.danger { border-color: var(--red); color: var(--red); }
    .btn.danger:hover { background: var(--red); color: white; }
    .btn.wide { grid-column: 1 / -1; }

    .form-row { display: flex; gap: 6px; align-items: center; }
    .form-row label { font-size: 0.72rem; color: var(--muted); width: 60px; flex-shrink: 0; }

    input, select {
      flex: 1; padding: 5px 8px; border-radius: 5px;
      border: 1px solid var(--border); background: var(--bg);
      color: var(--text); font-size: 0.75rem;
    }
    input:focus, select:focus { outline: none; border-color: var(--blue); }

    .tool-section {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px;
      display: flex; flex-direction: column; gap: 7px;
    }

    /* ── EVENT LOG ── */
    #log {
      flex: 1; padding: 10px 14px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 0.72rem; overflow-y: auto;
      display: flex; flex-direction: column; gap: 2px;
    }
    .ev { display: flex; gap: 8px; }
    .ev-time { color: var(--muted); flex-shrink: 0; }
    .ev-cat  { font-weight: 600; flex-shrink: 0; width: 60px; }
    .ev-msg  { color: var(--text); word-break: break-word; }
    .ev.LOCK    .ev-cat { color: var(--amber); }
    .ev.CAMERA  .ev-cat { color: var(--blue); }
    .ev.LIGHTS  .ev-cat { color: #bc8cff; }
    .ev.LOG     .ev-cat { color: var(--green); }
    .ev.AUTH    .ev-cat { color: var(--accent); }
    .ev.CONV    .ev-cat { color: var(--green); }
    .ev.ERROR   .ev-cat { color: var(--red); }
    .ev.INFO    .ev-cat { color: var(--muted); }

    /* ── STATUS PANEL ── */
    .status-block {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px;
    }

    /* Lock */
    #lock-icon { font-size: 2rem; text-align: center; margin: 4px 0; }
    #lock-state { text-align: center; font-size: 0.75rem; color: var(--muted); }

    /* LED Grid */
    #led-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 4px;
    }
    .led-dot {
      aspect-ratio: 1; border-radius: 50%;
      background: #1e2535;
    }
    .led-dot.active { background: #f5a623; box-shadow: 0 0 6px #f5a623; }
    .led-dot.has-item { background: #7a5000; }

    /* Camera */
    #camera-result {
      font-size: 0.72rem; color: var(--muted);
      font-family: 'SF Mono', 'Fira Code', monospace;
      white-space: pre-wrap; word-break: break-word;
    }

    /* Inventory */
    .inv-item {
      display: flex; justify-content: space-between; align-items: flex-start;
      padding: 5px 0; border-bottom: 1px solid var(--border); font-size: 0.75rem;
    }
    .inv-item:last-child { border-bottom: none; }
    .inv-name { color: var(--text); }
    .inv-pos { color: var(--muted); font-family: monospace; font-size: 0.68rem; }
    #inv-empty { color: var(--muted); font-size: 0.75rem; text-align: center; padding: 8px 0; }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  </style>
</head>
<body>

<!-- ── HEADER ── -->
<header>
  <h1>Sharing Station — Dev Dashboard</h1>
  <div id="conv-dot"></div>
  <span id="conv-label">No session</span>
  <button id="btn-mic" onclick="toggleMicMute()">Mic Live</button>
  <button id="btn-stop" onclick="stopConversation()">Stop Session</button>
</header>

<!-- ── MAIN ── -->
<main>

  <!-- LEFT: Controls -->
  <div class="panel">
    <div class="panel-title">Controls</div>
    <div class="panel-body">

      <!-- NFC Tap -->
      <div>
        <div class="section-label">NFC Tap</div>
        <div class="nfc-grid">
          <button class="btn" onclick="tapNfc('abc123', 'Peter')">Peter</button>
          <button class="btn" onclick="tapNfc('def456', 'Alice')">Alice</button>
          <button class="btn" onclick="tapNfc('ghi789', 'Bob')">Bob</button>
          <button class="btn" onclick="tapNfc('zzz999', 'New')">New Neighbor</button>
        </div>
      </div>

      <!-- Lock -->
      <div class="tool-section">
        <div class="section-label">Lock</div>
        <div class="nfc-grid">
          <button class="btn" onclick="callLock('unlock')">Unlock</button>
          <button class="btn danger" onclick="callLock('lock')">Lock</button>
        </div>
      </div>

      <!-- Camera -->
      <div class="tool-section">
        <div class="section-label">Camera</div>
        <div class="form-row">
          <label>Reason</label>
          <input id="cam-reason" type="text" value="deposit verification" placeholder="why?">
        </div>
        <button class="btn primary" onclick="snapCamera()">Snap Photo</button>
      </div>

      <!-- Lights -->
      <div class="tool-section">
        <div class="section-label">Lights</div>
        <div class="form-row">
          <label>Mode</label>
          <select id="light-mode">
            <option>idle</option>
            <option>highlight_item</option>
            <option>welcome</option>
            <option>goodbye</option>
            <option>error</option>
          </select>
        </div>
        <div class="form-row">
          <label>Row</label>
          <input id="light-row" type="number" min="0" max="2" value="0" style="width:60px;flex:none">
          <label style="width:30px">Col</label>
          <input id="light-col" type="number" min="0" max="9" value="0" style="width:60px;flex:none">
        </div>
        <div class="form-row">
          <label>Color</label>
          <input id="light-color" type="text" value="#f5a623" placeholder="#rrggbb">
        </div>
        <button class="btn primary" onclick="callLights()">Set Lights</button>
      </div>

      <!-- Log Item -->
      <div class="tool-section">
        <div class="section-label">Log Item</div>
        <div class="form-row">
          <label>Item</label>
          <input id="item-name" type="text" value="Dune" placeholder="item name">
        </div>
        <div class="form-row">
          <label>User ID</label>
          <input id="item-user" type="text" value="abc123" placeholder="user id">
        </div>
        <div class="form-row">
          <label>Slot</label>
          <input id="item-slot-row" type="number" min="0" max="2" placeholder="row" style="width:60px;flex:none">
          <input id="item-slot-col" type="number" min="0" max="9" placeholder="col" style="width:60px;flex:none">
        </div>
        <div class="form-row">
          <label>Action</label>
          <select id="item-action">
            <option value="deposit">Deposit</option>
            <option value="retrieval">Retrieval</option>
          </select>
        </div>
        <button class="btn primary" onclick="logItem()">Log Item</button>
      </div>

    </div>
  </div>

  <!-- CENTER: Activity Log -->
  <div class="panel" style="border-right:1px solid var(--border)">
    <div class="panel-title">Activity Log</div>
    <div id="log"></div>
  </div>

  <!-- RIGHT: Hardware State -->
  <div class="panel">
    <div class="panel-title">Hardware State</div>
    <div class="panel-body">

      <!-- Lock -->
      <div class="status-block">
        <div class="section-label">Door Lock</div>
        <div id="lock-icon">🔒</div>
        <div id="lock-state">locked</div>
      </div>

      <!-- LED Grid -->
      <div class="status-block">
        <div class="section-label" style="margin-bottom:8px">LED Grid (3 × 10)</div>
        <div id="led-grid"></div>
        <div id="led-label" style="font-size:0.68rem;color:var(--muted);margin-top:6px;text-align:center">idle</div>
      </div>

      <!-- Camera -->
      <div class="status-block">
        <div class="section-label">Last Camera Result</div>
        <div id="camera-result">No photo taken yet.</div>
      </div>

      <!-- Inventory -->
      <div class="status-block">
        <div class="section-label">Inventory (Available)</div>
        <div id="inventory-list"><div id="inv-empty">Loading…</div></div>
      </div>

      <!-- Checked Out -->
      <div class="status-block">
        <div class="section-label">Checked Out</div>
        <div id="checked-out-list"><div class="inv-empty-co">Loading…</div></div>
      </div>

    </div>
  </div>

</main>

<script>
  const API = window.location.origin;
  const logEl = document.getElementById('log');
  let currentMicMuted = false;
  let activeConversation = null;
  let activeUser = null;
  let sdkModulePromise = null;
  let sessionStarting = false;
  let activeSessionCount = 0;

  async function apiJson(path, options = {}) {
    const res = await fetch(`${API}${path}`, options);
    const text = await res.text();
    let data = {};
    if (text) {
      try {
        data = JSON.parse(text);
      } catch (_) {
        data = {};
      }
    }
    if (!res.ok) {
      throw new Error(data.detail || data.error || text || `Request failed (${res.status})`);
    }
    return data;
  }

  async function postJson(path, body) {
    return apiJson(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
  }

  async function getConversationSdk() {
    if (!sdkModulePromise) {
      sdkModulePromise = import('https://cdn.jsdelivr.net/npm/@elevenlabs/client/+esm');
    }
    const sdk = await sdkModulePromise;
    if (!sdk || !sdk.Conversation) {
      throw new Error('Failed to load ElevenLabs browser SDK');
    }
    return sdk.Conversation;
  }

  // ── Build LED grid ──
  const ledGrid = document.getElementById('led-grid');
  const dots = [];
  for (let i = 0; i < 30; i++) {
    const d = document.createElement('div');
    d.className = 'led-dot';
    d.title = `[${Math.floor(i / 10)}, ${i % 10}]`;
    ledGrid.appendChild(d);
    dots.push(d);
  }

  // ── Event log ──
  let knownEventTimes = new Set();

  function addEvent(category, message, t = null) {
    const now = t || new Date().toLocaleTimeString('en-US', { hour12: false });
    const key = `${t}|${category}|${message}`;
    if (t && knownEventTimes.has(key)) return;
    if (t) knownEventTimes.add(key);
    const ev = document.createElement('div');
    ev.className = `ev ${category}`;
    ev.innerHTML = `<span class="ev-time">${now}</span><span class="ev-cat">${category}</span><span class="ev-msg">${escHtml(message)}</span>`;
    logEl.prepend(ev);
    // keep log from growing forever
    while (logEl.children.length > 200) logEl.removeChild(logEl.lastChild);
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function summarizeItems(items) {
    const grouped = {};
    for (const item of items || []) {
      const name = (item && item.name) || 'Unknown';
      if (!grouped[name]) {
        grouped[name] = { name, type: item.type || 'unknown', copies: 0, positions: [] };
      }
      grouped[name].copies += 1;
      if (Array.isArray(item.position)) grouped[name].positions.push(item.position);
    }
    const summaryItems = Object.values(grouped);
    const summaryText = summaryItems.map(it => it.copies > 1 ? `${it.name} (${it.copies} available)` : it.name).join(', ') || 'nothing';
    return { summaryItems, summaryText };
  }

  function summarizeItemNames(names) {
    const counts = new Map();
    for (const name of names || []) {
      if (!name || !String(name).trim()) continue;
      const key = String(name).trim();
      counts.set(key, (counts.get(key) || 0) + 1);
    }
    if (counts.size === 0) return 'none';
    return Array.from(counts.entries()).map(([name, count]) => count > 1 ? `${name} x${count}` : name).join(', ');
  }

  function buildContextUpdate(user) {
    if (!user) return '';
    const parts = [];
    if (user.user_name) parts.push(`Authenticated user name: ${user.user_name}.`);
    if (user.nickname) parts.push(`Nickname: ${user.nickname}.`);
    if (user.user_id) parts.push(`User ID: ${user.user_id}.`);
    parts.push(`New user: ${user.is_new_user ? 'yes' : 'no'}.`);
    if (Array.isArray(user.memories) && user.memories.length > 0) {
      parts.push(`Known memories/preferences: ${user.memories.join('; ')}.`);
    }
    const stationItems = summarizeItemNames(user.contributed_items || []);
    const checkedOutItems = summarizeItemNames(user.checked_out_items || []);
    const name = user.user_name || 'this user';
    parts.push(`Items ${name} has deposited and are currently in the station: ${stationItems}.`);
    parts.push(`Items ${name} currently has checked out: ${checkedOutItems}.`);
    return parts.join(' ').trim();
  }

  function buildClientTools() {
    const tools = {};
    const register = (aliases, handler) => {
      for (const alias of aliases) tools[alias] = handler;
    };

    register(
      ['snap_camera_photo', 'functions.snap_camera_photo', 'camera', 'functions.camera'],
      async (params = {}) => {
        const reason = params.reason || params.context || 'agent requested camera context';
        const prompt = params.prompt;
        addEvent('CAMERA', `Agent tool: snap_camera_photo (${reason})`);
        return postJson('/api/tools/camera', { reason, prompt });
      }
    );

    register(
      ['get_inventory', 'functions.get_inventory', 'inventory', 'functions.inventory'],
      async () => {
        const data = await apiJson('/api/tools/inventory');
        const items = data.items || [];
        const { summaryItems, summaryText } = summarizeItems(items);
        addEvent('LOG', `Agent tool: get_inventory (${items.length} items)`);
        return { summary: `Available items: ${summaryText}`, items: summaryItems, total_count: items.length };
      }
    );

    register(
      ['get_available_slots', 'functions.get_available_slots', 'available_slots', 'functions.available_slots'],
      async () => {
        addEvent('LOG', 'Agent tool: get_available_slots');
        return apiJson('/api/tools/available-slots');
      }
    );

    register(
      ['log_item', 'functions.log_item', 'log-item', 'functions.log-item'],
      async (params = {}) => {
        const body = { ...params };
        if (!body.user_id && activeUser && activeUser.user_id) {
          body.user_id = activeUser.user_id;
        }
        addEvent('LOG', `Agent tool: log_item (${body.action || 'unknown'})`);
        return postJson('/api/tools/log-item', body);
      }
    );

    register(
      ['update_user_info', 'functions.update_user_info', 'user_info', 'functions.user_info'],
      async (params = {}) => {
        const body = { ...params };
        if (!body.user_id && activeUser && activeUser.user_id) {
          body.user_id = activeUser.user_id;
        }
        addEvent('AUTH', 'Agent tool: update_user_info');
        return postJson('/api/tools/user-info', body);
      }
    );

    register(
      ['control_lights', 'functions.control_lights', 'lights', 'functions.lights'],
      async (params = {}) => {
        let position = params.position;
        if (!position && Number.isInteger(params.row) && Number.isInteger(params.col)) {
          position = [params.row, params.col];
        }
        addEvent('LIGHTS', `Agent tool: control_lights (${params.mode || 'idle'})`);
        return postJson('/api/tools/lights', {
          mode: params.mode || 'idle',
          position,
          color: params.color,
        });
      }
    );

    register(
      ['end_conversation', 'functions.end_conversation', 'end-conversation', 'functions.end-conversation', 'endConversation', 'functions.endConversation'],
      async () => {
        addEvent('CONV', 'Agent tool: end_conversation — ending session in 6s');
        setTimeout(async () => {
          if (activeConversation) {
            try { await activeConversation.endSession(); } catch (_) {}
            activeConversation = null;
          }
          try { await postJson('/conversation/stop', {}); } catch (_) {}
        }, 6000);
        return { success: true };
      }
    );

    return tools;
  }

  async function syncConversationState(partialState) {
    try {
      await postJson('/conversation/state', partialState);
    } catch (_) {
      // Ignore state sync failures; session can still continue locally.
    }
  }

  async function startWebRtcConversation(user) {
    activeUser = user;
    if (activeConversation) {
      try {
        await activeConversation.endSession();
      } catch (_) {}
      activeConversation = null;
    }

    addEvent('CONV', 'Preparing WebRTC session...');

    try {
      const preflight = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
      });
      preflight.getTracks().forEach(track => track.stop());
    } catch (e) {
      addEvent('ERROR', 'Microphone permission denied');
      throw e;
    }

    const tokenData = await postJson('/conversation/token', {});
    const Conversation = await getConversationSdk();

    const options = {
      connectionType: 'webrtc',
      userId: user.user_id || undefined,
      clientTools: buildClientTools(),
      onConnect: async () => {
        activeSessionCount++;
        addEvent('CONV', `WebRTC connected (sessions: ${activeSessionCount})`);
        if (activeSessionCount > 1) {
          addEvent('ERROR', `Multiple sessions detected (${activeSessionCount}) — this should not happen`);
        }
        currentMicMuted = false;
        await syncConversationState({
          active: true,
          mic_muted: false,
          user_id: user.user_id || null,
          user_name: user.user_name || null,
        });
      },
      onDisconnect: async () => {
        activeSessionCount = Math.max(0, activeSessionCount - 1);
        addEvent('CONV', `WebRTC disconnected (sessions: ${activeSessionCount})`);
        activeConversation = null;
        currentMicMuted = false;
        await syncConversationState({ active: false, mic_muted: false });
      },
      onModeChange: (modeEvent) => {
        const mode = typeof modeEvent === 'string' ? modeEvent : (modeEvent && modeEvent.mode) || 'unknown';
        addEvent('CONV', `Mode: ${mode}`);
      },
      onMessage: (msg) => {
        const source = msg.source === 'user' ? 'You' : 'Agent';
        addEvent('CONV', `${source}: ${msg.message}`);
      },
      onInterruption: () => {
        addEvent('CONV', 'Interruption detected');
      },
      onError: (error) => {
        addEvent('ERROR', `WebRTC error: ${error && error.message ? error.message : error}`);
      },
      onUnhandledClientToolCall: (event) => {
        const toolName = event && event.toolName ? event.toolName : 'unknown';
        addEvent('ERROR', `Unhandled client tool: ${toolName}`);
      },
    };

    if (tokenData.conversation_token) {
      options.conversationToken = tokenData.conversation_token;
    } else {
      options.agentId = tokenData.agent_id;
    }

    activeConversation = await Conversation.startSession(options);

    const context = buildContextUpdate(user);
    if (context) {
      activeConversation.sendContextualUpdate(context);
      addEvent('CONV', 'User context sent to agent');
    }
  }

  // ── Poll /api/status ──
  let lastEventSet = new Set();

  async function poll() {
    try {
      const res = await fetch(`${API}/api/status`);
      if (!res.ok) return;
      const d = await res.json();

      // Conversation dot
      const dot = document.getElementById('conv-dot');
      const label = document.getElementById('conv-label');
      dot.className = d.conversation_active ? 'active' : '';
      const modeLabel = d.conversation_mode || 'unknown';
      label.textContent = d.conversation_active ? `Session active (${modeLabel})` : `No session (${modeLabel})`;

      // Mic mute state
      currentMicMuted = !!d.mic_muted;
      const micBtn = document.getElementById('btn-mic');
      micBtn.className = currentMicMuted ? 'muted' : '';
      micBtn.textContent = currentMicMuted ? 'Mic Muted' : 'Mic Live';

      // Lock
      const locked = d.lock === 'locked';
      document.getElementById('lock-icon').textContent = locked ? '🔒' : '🔓';
      document.getElementById('lock-state').textContent = d.lock;
      document.getElementById('lock-state').style.color = locked ? 'var(--amber)' : 'var(--green)';

      // LED grid
      const activeLed = d.led;
      const occupiedSlots = new Set();
      (d.inventory || []).forEach(item => {
        const pos = item.position;
        if (Array.isArray(pos) && pos.length === 2) {
          occupiedSlots.add(pos[0] * 10 + pos[1]);
        }
      });
      dots.forEach((dot, i) => {
        const isActive = activeLed && activeLed.mode !== 'idle' &&
          Array.isArray(activeLed.position) &&
          activeLed.position[0] * 10 + activeLed.position[1] === i;
        dot.className = 'led-dot' + (isActive ? ' active' : (occupiedSlots.has(i) ? ' has-item' : ''));
      });
      const ledMode = activeLed ? activeLed.mode : 'idle';
      const ledPos = activeLed && Array.isArray(activeLed.position) ? ` @ [${activeLed.position}]` : '';
      document.getElementById('led-label').textContent = ledMode + ledPos;

      // Camera
      const camEl = document.getElementById('camera-result');
      if (d.camera) {
        const items = (d.camera.items_detected || []).map(it => `${it.name} (${it.condition})`).join('\n');
        camEl.textContent = items || d.camera.raw_description || JSON.stringify(d.camera, null, 2);
      } else {
        camEl.textContent = 'No photo taken yet.';
      }

      // Inventory (available)
      const invEl = document.getElementById('inventory-list');
      if (!d.inventory || d.inventory.length === 0) {
        invEl.innerHTML = '<div id="inv-empty">Empty</div>';
      } else {
        invEl.innerHTML = d.inventory.map(item => {
          const pos = Array.isArray(item.position) ? `[${item.position}]` : '—';
          return `<div class="inv-item">
            <span class="inv-name">${escHtml(item.name)}</span>
            <span class="inv-pos">${pos}</span>
          </div>`;
        }).join('');
      }

      // Checked out
      const coEl = document.getElementById('checked-out-list');
      if (!d.checked_out || d.checked_out.length === 0) {
        coEl.innerHTML = '<div id="inv-empty">None</div>';
      } else {
        coEl.innerHTML = d.checked_out.map(item => {
          const who = item.borrowed_by || 'unknown';
          return `<div class="inv-item">
            <span class="inv-name">${escHtml(item.name)}</span>
            <span class="inv-pos" style="color:var(--amber)">${escHtml(who)}</span>
          </div>`;
        }).join('');
      }

      // Start WebRTC session if server has a pending user (triggered by NFC poller)
      if (d.pending_user && !activeConversation && !sessionStarting) {
        sessionStarting = true;
        const user = d.pending_user;
        addEvent('AUTH', `NFC login: ${user.user_name}${user.is_new_user ? ' [NEW USER]' : ''}`);
        try {
          await startWebRtcConversation(user);
        } catch (e) {
          addEvent('ERROR', `Auto-start failed: ${e.message}`);
        } finally {
          sessionStarting = false;
        }
      }

      // Merge server events into log (avoid duplicates)
      (d.events || []).forEach(ev => {
        const key = `${ev.t}|${ev.category}|${ev.message}`;
        if (!lastEventSet.has(key)) {
          lastEventSet.add(key);
          addEvent(ev.category, ev.message, ev.t);
        }
      });

    } catch (e) {
      // Server not running — don't spam
    }
  }

  // Start polling
  poll();
  setInterval(poll, 1000);

  // ── API helpers ──

  async function tapNfc(nfcId, label) {
    addEvent('AUTH', `NFC tap: ${label} (${nfcId})`);
    try {
      const data = await postJson('/api/auth/nfc', { nfc_id: nfcId, name: label === 'New' ? null : label });
      if (data.authenticated) {
        const who = data.nickname ? `${data.user_name} aka "${data.nickname}"` : data.user_name;
        addEvent('AUTH', `Authenticated → ${who}${data.is_new_user ? ' [NEW USER]' : ''}`);
        if ((data.conversation_mode || 'webrtc') === 'webrtc' && !sessionStarting) {
          sessionStarting = true;
          try {
            await startWebRtcConversation(data);
          } finally {
            sessionStarting = false;
          }
        } else {
          addEvent('CONV', 'Server-side conversation started');
        }
      } else {
        addEvent('ERROR', `Auth failed: ${JSON.stringify(data)}`);
      }
    } catch (e) {
      addEvent('ERROR', e.message);
    }
  }

  async function callLock(action) {
    addEvent('LOCK', `Calling lock(${action})`);
    try {
      const res = await fetch(`${API}/api/tools/lock`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action }),
      });
      const data = await res.json();
      addEvent('LOCK', `Result: ${data.state}`);
    } catch (e) {
      addEvent('ERROR', e.message);
    }
  }

  async function snapCamera() {
    const reason = document.getElementById('cam-reason').value || 'manual test';
    addEvent('CAMERA', `Snap: "${reason}"`);
    try {
      const res = await fetch(`${API}/api/tools/camera`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ reason }),
      });
      const data = await res.json();
      const items = (data.items_detected || []).map(i => i.name).join(', ') || 'none';
      addEvent('CAMERA', `Detected: ${items}`);
    } catch (e) {
      addEvent('ERROR', e.message);
    }
  }

  async function callLights() {
    const mode = document.getElementById('light-mode').value;
    const row = parseInt(document.getElementById('light-row').value);
    const col = parseInt(document.getElementById('light-col').value);
    const color = document.getElementById('light-color').value;
    addEvent('LIGHTS', `mode=${mode}, pos=[${row},${col}], color=${color}`);
    try {
      const res = await fetch(`${API}/api/tools/lights`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mode, position: [row, col], color }),
      });
      const data = await res.json();
      addEvent('LIGHTS', `OK: ${JSON.stringify(data)}`);
    } catch (e) {
      addEvent('ERROR', e.message);
    }
  }

  async function logItem() {
    const item_name = document.getElementById('item-name').value;
    const user_id = document.getElementById('item-user').value;
    const action = document.getElementById('item-action').value;
    const slotRowVal = document.getElementById('item-slot-row').value;
    const slotColVal = document.getElementById('item-slot-col').value;
    if (!item_name || !user_id) { addEvent('ERROR', 'Item name and user ID required'); return; }
    const body = { item_name, action, user_id };
    if (slotRowVal !== '' && slotColVal !== '') {
      body.slot_row = parseInt(slotRowVal);
      body.slot_col = parseInt(slotColVal);
    }
    addEvent('LOG', `${action}: "${item_name}" by ${user_id}${body.slot_row != null ? ` → slot [${body.slot_row},${body.slot_col}]` : ''}`);
    try {
      const res = await fetch(`${API}/api/tools/log-item`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      addEvent('LOG', `Inventory count: ${data.inventory_count}`);
    } catch (e) {
      addEvent('ERROR', e.message);
    }
  }

  async function stopConversation() {
    addEvent('CONV', 'Stopping session…');
    try {
      if (activeConversation) {
        await activeConversation.endSession();
      }
      await fetch(`${API}/conversation/stop`, { method: 'POST' });
      activeConversation = null;
      currentMicMuted = false;
      addEvent('CONV', 'Session stopped');
    } catch (e) {
      addEvent('ERROR', e.message);
    }
  }

  async function setMicMuted(muted) {
    if (!activeConversation) {
      addEvent('ERROR', 'No active WebRTC session');
      return;
    }
    try {
      activeConversation.setMicMuted(!!muted);
      const data = await postJson('/conversation/mic', { muted: !!muted });
      currentMicMuted = Boolean(data.mic_muted);
      addEvent('CONV', `Mic ${currentMicMuted ? 'muted' : 'unmuted'}`);
    } catch (e) {
      addEvent('ERROR', e.message);
    }
  }

  async function toggleMicMute() {
    await setMicMuted(!currentMicMuted);
  }

  // Initial health check
  fetch(`${API}/health`)
    .then(r => r.json())
    .then(d => addEvent('INFO', `Server: ${d.status}`))
    .catch(() => addEvent('ERROR', 'Server not reachable'));
</script>
</body>
</html>
